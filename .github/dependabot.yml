version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "master"
    reviewers:
      - "gallenc"
      - "OpenNMS/dependabot-reviewers-maven"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "daily"
    ignore:
      # jaxb-core/jaxb-impl 3.x+ moved to the jakarta.xml.bind namespace.
      # The model still uses javax.xml.bind (jaxb-api 2.3.1, the JAXB2 codegen
      # plugin and jaxb2-basics), so a major bump here needs a coordinated
      # javax -> jakarta migration, not an isolated version bump.
      - dependency-name: "com.sun.xml.bind:jaxb-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.sun.xml.bind:jaxb-impl"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "master"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"
