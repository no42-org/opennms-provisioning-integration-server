version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "main"
    reviewers:
      - "gallenc"
      - "OpenNMS/dependabot-reviewers-maven"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"
    ignore:
      # Stay on the current Temurin LTS line (25) and keep receiving 25.0.x
      # patch updates. Major jumps (including the non-LTS 26/27/28 releases) are
      # done manually when moving to the next LTS.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
