version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "main"
    reviewers:
      - "gallenc"
      - "OpenNMS/dependabot-reviewers-maven"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "daily"
    ignore:
      # jaxb-core/jaxb-impl 3.x+ moved to the jakarta.xml.bind namespace.
      # The model still uses javax.xml.bind (jaxb-api 2.3.1, the JAXB2 codegen
      # plugin and jaxb2-basics), so a major bump here needs a coordinated
      # javax -> jakarta migration, not an isolated version bump.
      - dependency-name: "com.sun.xml.bind:jaxb-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.sun.xml.bind:jaxb-impl"
        update-types: ["version-update:semver-major"]
      # jaxb2-basics 2.x relocated the runtime packages
      # (org.jvnet.jaxb2_commons.lang / .locator.util) as part of the same
      # javax -> jakarta move. The XJC plugin (jaxb2-basics) and its runtime
      # (jaxb2-basics-runtime) must stay in lockstep on 0.x until that
      # migration happens, so ignore isolated major bumps of either.
      - dependency-name: "org.jvnet.jaxb2_commons:jaxb2-basics"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jvnet.jaxb2_commons:jaxb2-basics-runtime"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"
    ignore:
      # Stay on the current Temurin LTS line and keep receiving 21.0.x patch
      # updates. Major jumps (including the non-LTS 22/23/24/26 releases) are
      # done manually when moving to the next LTS.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
